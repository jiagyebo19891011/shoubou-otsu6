let current = 0;

function showQuestion(){

document.getElementById("question").innerText =
questions[current].q;

document.getElementById("progress").innerText =
(reviewMode ? "【復習モード】 " : "") +
"問題番号 " +
(current + 1) +
" / " +
questions.length;

}


function answer(userAnswer){

if(userAnswer === questions[current].a){

document.getElementById("result").innerText =
"⭕ 正解";

score++;

}else{

document.getElementById("result").innerText =
"❌ 不正解";

if(!wrongQuestions.includes(current)){
    wrongQuestions.push(current);
}

}

document.getElementById("score").innerText =
score;

let rate =
Math.round(
(score / questions.length) * 100
);

document.getElementById("rate").innerText =
rate;
document.getElementById("wrongCount").innerText =
wrongQuestions.length;

}

if(reviewMode){

Math.floor(Math.random() * wrongQuestions.length)
];

}while(newQuestion === current);

}

];
